# One-off diagnosis (throwaway branch, never merged): does Vercel serve the new
# Google sign-in return page at /__/auth/handler (preview of google-signin-direct,
# and production once merged)?
name: Diagnose sign-in proxy
on:
  push:
    branches: [diag-auth-proxy]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch /__/auth/handler
        run: |
          for host in accountbook-git-google-signin-direct-lowky.vercel.app accbook.vercel.app; do
            u="https://$host/__/auth/handler"
            echo "=================== $u"
            curl -sS -o body.txt -D headers.txt -w "status %{http_code} | type %{content_type} | bytes %{size_download}\n" "$u" || true
            grep -iE "^(server|location|x-vercel-cache):" headers.txt || true
            grep -c "accountBook.googleReturn" body.txt | sed 's/^/new return page markers: /'
            grep -c "handler.js" body.txt | sed 's/^/firebase helper markers: /'
            grep -c 'id="splash"' body.txt | sed 's/^/app page markers: /'
            head -c 200 body.txt; echo
          done
