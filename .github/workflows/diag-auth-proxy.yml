# One-off diagnosis (throwaway branch, never merged): is the new Google sign-in
# return page live at /__/auth/handler, and does it hand the token to the app?
name: Diagnose sign-in proxy
on:
  push:
    branches: [diag-auth-proxy]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Wait for the deploy, then fetch /__/auth/handler
        run: |
          for i in $(seq 1 20); do
            curl -sS -o body.txt -w "try $i: status %{http_code} | bytes %{size_download}\n" "https://accbook.vercel.app/__/auth/handler" || true
            if grep -q "accountBook.googleReturn" body.txt; then echo "NEW RETURN PAGE IS LIVE"; cat body.txt; exit 0; fi
            sleep 15
          done
          echo "new return page not live after 5 minutes; got:"; head -c 400 body.txt; exit 1
      - name: Install the browser
        working-directory: browser-tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: The return page hands the token to the app
        working-directory: browser-tests
        run: node ../.github/diag/handler-check.mjs
